<!-- ═══ HEADER ═══ -->
<header class="app-header">
  <div class="max-w-7xl mx-auto px-5 py-3 flex items-center justify-between gap-4">

    <!-- Logo -->
    <a routerLink="/decks" class="flex items-center gap-3 no-underline">
      <span style="font-size:28px; line-height:1; filter: drop-shadow(0 0 10px rgba(250,204,21,0.7))">⚡</span>
      <span class="text-lg font-bold gradient-text tracking-tight">TCG Deck Builder</span>
    </a>

    <!-- Nav -->
    <nav class="flex items-center gap-2">
      <a routerLink="/decks"
         routerLinkActive="active-nav"
         class="btn-ghost text-sm">
        🗃️ Meus Baralhos
      </a>
      <a routerLink="/create-deck" class="btn-primary text-sm">
        + Novo Baralho
      </a>
      <button (click)="toggleTheme()" class="btn-ghost" title="Alternar Tema" style="padding:8px 10px;">
        {{ currentTheme === 'dark' ? '☀️' : '🌙' }}
      </button>
    </nav>

  </div>
</header>

<!-- ═══ MAIN CONTENT ═══ -->
<main class="max-w-7xl mx-auto px-5 py-8">
  <router-outlet></router-outlet>
</main>

<!-- ═══ TOASTS ═══ -->
<div class="toast-container">
  <div
    *ngFor="let toast of toastService.toasts"
    [class]="'toast toast-' + toast.type"
    [class.removing]="toast.removing"
    (click)="toastService.dismiss(toast.id)"
  >
    <span>
      {{ toast.type === 'success' ? '✅' : toast.type === 'error' ? '❌' : toast.type === 'warning' ? '⚠️' : 'ℹ️' }}
    </span>
    <span>{{ toast.message }}</span>
  </div>
</div>
